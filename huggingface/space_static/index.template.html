<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multimodal Market AI</title>
<meta name="description" content="A causal research framework for financial-market systems that combine deterministic rules, numerical models and visual/VLM information. Not a trading bot.">
<style>
:root {
  --bg: #fafaf8;
  --fg: #1d1d1b;
  --muted: #5f5f5a;
  --card: #ffffff;
  --line: #e3e2dc;
  --accent: #2f5d8a;
  --warn: #7a6a1f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615;
    --fg: #ececea;
    --muted: #a3a39c;
    --card: #1f1f1d;
    --line: #34332f;
    --accent: #7fb0e0;
    --warn: #d9c76a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 16px; }
h2 { font-size: 1.35rem; line-height: 1.25; margin: 44px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h3 { font-size: 1.1rem; margin: 28px 0 8px; }
p { margin: 0 0 14px; }
a { color: var(--accent); }
ul, ol { padding-left: 24px; margin: 0 0 14px; }
li { margin-bottom: 4px; }
blockquote {
  margin: 20px 0;
  padding: 10px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 4px solid var(--warn);
  border-radius: 8px;
}
blockquote p:last-child { margin-bottom: 0; }
code {
  font: 0.88em ui-monospace, "Cascadia Code", Consolas, monospace;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
}
pre {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  font: 0.88rem/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  margin: 0 0 16px;
}
pre code { background: none; border: 0; padding: 0; font: inherit; }
pre.mermaid { text-align: center; }
table {
  display: block;
  overflow-x: auto;
  border-collapse: collapse;
  margin: 0 0 16px;
  font-size: 0.93rem;
}
th, td { padding: 8px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--card); font-weight: 600; }
img { max-width: 100%; height: auto; }
td img { min-width: 200px; background: #fff; border-radius: 4px; }
p > a > img, p > img { vertical-align: middle; }
hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
</style>
</head>
<body>
<main>
<!--README_BODY-->
</main>
<script type="module">
  // Same diagram GitHub draws from the README's mermaid block. If this script cannot load, the
  // diagram source stays on the page as text.
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
  await mermaid.run({ querySelector: "pre.mermaid" });
</script>
</body>
</html>
